[project]
name = "agent-game"
version = "0.2.2"
description = "Game framework for AI agents — MCP-based games with prompt-injection loop pattern"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "agent-game contributors" },
]

dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[project.scripts]
agent-game-server = "agent_game_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_game_server"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

