[project]
name = "agent-game"
version = "0.3.0"
description = "Game framework for AI agents — MCP-based games with prompt-injection loop pattern"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "agent-game contributors" },
]

dependencies = [
    "mcp>=2.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[project.scripts]
agent-game-server = "agent_game_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_game_server"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.0",
    "coverage>=7.17.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未注册的 mark 直接报错：拼错 mark 会让整条用例悄悄失去筛选语义
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
# 慢用例（轮询、ASGI 往返）保持在低位数，超时阈值统一在 conftest 之外显式设置
timeout = 120

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# 门槛是保守值：当前实测约 93% 语句 / 92% 分支。
# 覆盖率不是验收判据（变异测试才是），这里只防止大幅倒退。
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes：未使用导入/变量、重复定义（F811）
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "E501",  # 行宽交给 formatter；中文注释按显示宽度算会误报
    "B008",  # FastAPI 的 Depends() 默认值写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",  # assert False 在测试里是可接受的写法
    "SIM117",  # 嵌套 with 在测试里更清楚
]
"scripts/*" = [
    "E501",  # 变异体里的长锚点无法折行
]
