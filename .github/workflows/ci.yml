name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all -- --check

      - name: Clippy
        # `-D warnings` 让任何告警都变红。workspace 的 lint 配置在 Cargo.toml 的
        # [workspace.lints] 里，测试代码的 unwrap 由 clippy.toml 放行。
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: 测试与覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: 单元与集成测试
        run: cargo nextest run --workspace

      - name: 覆盖率
        # 门槛在下面这条命令里，不是 pyproject 那种配置项：Rust 这边
        # 覆盖率不是验收判据（变异测试才是），它只防止大幅倒退。
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 85

  mutation:
    name: 变异测试
    # 单独一个 job：它要反复重跑整套测试，比前两个慢一个数量级。
    # 只有它失败才说明"测试没看住某处规则"，与覆盖率无关。
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants

      - name: 变异测试（core）
        # 只对 core 做全量：规则、预算、身份、等待都在这里，是"必须被守住"
        # 的那一层。server/mcp 两层的传输行为已由集成测试覆盖，全量跑代价过高。
        run: cargo mutants -p agent-game-server-core --config .config/mutants.toml
