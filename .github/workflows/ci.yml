name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups

      - name: 静态检查
        run: uv run ruff check .

      - name: 单元测试与覆盖率
        # 覆盖率门槛在 pyproject 的 [tool.coverage.report] 里（fail_under = 90）。
        # 覆盖率不是验收判据——它只回答"这行被跑过"，不回答"这条规则被守住"。
        # 真正的验收是下面的变异测试。
        run: uv run coverage run -m pytest && uv run coverage report

  mutation:
    # 变异测试单独一个 job：它要跑 50 次完整套件，约 10 分钟。
    # 只有它失败时才说明了"测试没看住某处规则"，与覆盖率无关。
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups

      - name: 变异测试
        # 退出码非零表示有变异体存活（某个位置没有看门人）或变异体失效
        # （源码改了而脚本没跟上）。两者都该让 CI 变红。
        run: uv run python scripts/mutation_check.py
