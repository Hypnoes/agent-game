name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # 仓库根 `.cargo/config.toml` 把 `rustc-wrapper` 设成了 `sccache`（本地加速用）。
  # GitHub runner 默认没装它，于是每一条 cargo 命令都报
  #   could not execute process `sccache ...` (No such file or directory)
  # 整个 CI 从来没跑过真实检查。
  #
  # 修法是**装上** sccache（见各 job 的 `mozilla-actions/sccache-action`），
  # 而不是把它覆盖掉——变异测试要为 271 个变异体各重编译一遍 core 及其消费者，
  # 那是它 40 分钟耗时的主要来源；sccache 能复用未变部分的编译产物。
  #
  # 这里声明用 GitHub Actions 缓存作为 sccache 后端。具体的 wrapper 由各 job 的
  # `mozilla-actions/sccache-action` 注入：它写 `RUSTC_WRAPPER=sccache` 到
  # `GITHUB_ENV`，值恰好与仓库 `.cargo/config.toml` 里的一致，因此两者不冲突，
  # 而环境变量优先级更高、能确保走 GHA 缓存而不是本地磁盘。
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: 格式
        run: cargo fmt --all -- --check

      - name: Clippy
        # `-D warnings` 让任何告警都变红。workspace 的 lint 配置在 Cargo.toml 的
        # [workspace.lints] 里，测试代码的 unwrap 由 clippy.toml 放行。
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: 测试与覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - name: 单元与集成测试
        run: cargo nextest run --workspace

      - name: 覆盖率
        # 门槛在下面这条命令里，不是配置文件：覆盖率不是验收判据
        # （变异测试才是），它只防止大幅倒退。
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 85

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 管理页面逻辑
        # admin.html 的 JS 是字符串资产，Rust 侧只能断言"文件里有没有某段文本"。
        # 这个脚本把 `<script>` 抽出来在最小 DOM 桩里跑，验证转义、状态归类与渲染。
        run: node tools/verify-admin-ui.js

      - name: 产物里无测试替身
        # `domain::testing::DummyEngine` 不该进发布产物——它的 `admin_view()`
        # 会返回假的"秘密" `admin-only`。007（#9）之前它是无条件 `pub mod`，
        # 实测 domain 的 rlib 里能串扫到这两个字符串。
        #
        # 结构性的门控写在 `crates/agent-game-core/tests/testing_gate.rs` 里，
        # 但那条用例只验"cfg 与 Cargo.toml 写对了"。这一条验最终事实：
        # release 产物里真的没有。两道防线各管一段。
        #
        # **不要加 `--all-features`**：那会主动打开 `testing`，自己把替身
        # 塞回去（实测 643,286 字节的 rlib，`DummyEngine` 在）。
        #
        # 也**不要**加 `-p`：只构建 core 会漏掉 domain，只构建 domain 会漏掉
        # 经过 core 再导出的路径。必须整个 workspace。
        run: |
          set -euo pipefail
          cargo build --release --workspace
          found=0
          for rlib in target/release/libagent_game*.rlib; do
            # **不要用 `strings "$rlib" | grep -q ...`**：`grep -q` 命中即退出，
            # `strings` 会收到 SIGPIPE，在 `pipefail` 下整条管道返回非零，
            # `if` 把它当成"没找到"——恰恰在**有泄露**的时候漏报。
            # 改成把 grep 输出重定向掉、用退出码判断，管道就不会提前关闭。
            if strings "$rlib" | grep -E 'DummyEngine|admin-only' > /dev/null; then
              echo "::error::测试替身泄漏进发布产物: $rlib"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "发布产物里没有 DummyEngine / admin-only"

  mutation:
    name: 变异测试
    # 单独一个 job：它要反复重跑整套测试，比前两个慢一个数量级。
    # 只有它失败才说明"测试没看住某处规则"，与覆盖率无关。
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: taiki-e/install-action@cargo-mutants

      - name: 变异测试（core）
        # 变异 core，但判断"这个变异有没有被抓住"时要用**消费者 crate** 的测试。
        #
        # 为什么不能只跑 `-p core`：#5 把 infra / domain 抽成独立 crate 之后，
        # 有一部分看门用例天然住在别的 crate 里——例如
        # `GuessNumberEngine::describe_tools()` 返回空表这个变异，会被
        # `agent-game-mcp` 的 `tools.rs` 用例抓住（实测 2 条红）。默认行为只跑
        # 被测 crate 自己的测试，于是它被判为"存活"——不是没有看门人，
        # 是看门人不在这个 crate 里。
        #
        # 为什么不用 `--test-workspace true`：那样每个变异体都要跑全部 527 条
        # 测试。实测 271 个变异体跑了 25 分钟还没完。
        #
        # 成本现状：这三个 test-package 下实测 **271 变异体 / 40 分钟**
        # （250 caught + 21 unviable，0 存活）。慢的原因不是测试条数，而是每个
        # 变异体都要重编译 core 及依赖它的 mcp/server——单变异体 8.9 秒里绝大
        # 部分是编译。
        #
        # 40 分钟作为"只在本 job 跑、且 needs: test"的门槛是可接受的：它不阻塞
        # 前两个 job，且只在测试全绿后才启动。想再快只能减少变异体（用
        # `--in-diff` 只变异改动行，会漏掉未改动代码的回归）或拆 job 并行
        # （需要 --shards，代价是可以并行的前提还没验证）。当前选可接受而非最优。
        #
        # infra / domain 暂不纳入：这两层的测试是从 core 整体搬过来的，还没做过
        # 像 core 那样五轮的变异收敛（见 docs/issues/004-riir.md）。实测把两层
        # 加进来会活 57 个，那是"新测试还没做完"，不该在纯结构重排的 PR 里
        # 顺带解决。
        #
        # 本 job 没有 timeout-minutes，用 GitHub 默认的 360 分钟；40 分钟有充足余量。
        run: |
          cargo mutants -p agent-game-server-core \
            --test-package agent-game-server-core \
            --test-package agent-game-server-mcp \
            --test-package agent-game-server-server \
            --config .config/mutants.toml
