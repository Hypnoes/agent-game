# 猜数字提示词 —— 改这个文件然后 POST /api/v1/admin/prompts/reload 即可生效，不用重启。
#
# 与 Python 版 `assets/guess_number_prompts.py` 逐字一致。占位符语法只有两种：
# `{name}` 与 `{name:g}`（浮点去掉多余的零）。

[templates]
won = """
🎉 你猜对了！答案就是 {last_guess}。
共用了 {count} 次猜测。

要再来一局吗？调用 guess_number_start 开始新游戏。"""

lost = """
😞 游戏结束，用完 {max_attempts} 次机会。
答案: {target}
历史: {history}

要再来一局吗？调用 guess_number_start 开始新游戏。"""

in_progress = """
第 {count} 次: {last_number} → {hint}
剩余 {remaining} 次 | 范围 {min_num}-{max_num}
历史: {history}

🎮 **游戏进行中**。调用 guess_number_guess(number=N) 继续。"""

in_progress_first = """
剩余 {remaining} 次 | 范围 {min_num}-{max_num}

🎮 **游戏进行中**。调用 guess_number_guess(number=N) 开始猜测。"""
