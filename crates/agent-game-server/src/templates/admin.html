<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent-game 管理后台</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --blue: #58a6ff;
      --purple: #bc8cff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
      color: var(--blue);
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .dot.live {
      background: var(--green);
      animation: pulse 2s infinite;
    }

    .dot.dead {
      background: var(--red);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:hover {
      background: var(--card);
    }

    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
    }

    /* 状态配色不列具体名字：新游戏可以有任意终态（draw、aborted…），
       页面只区分"还在进行"与"已结束"两类。 */
    .status.live {
      background: #1f6feb33;
      color: var(--blue);
    }

    .status.done {
      background: #3fb95033;
      color: var(--green);
    }

    .game-type {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      background: var(--purple);
      color: #fff;
    }

    .detail-panel {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: none;
    }

    .detail-panel.active {
      display: block;
    }

    .detail-title {
      font-size: 16px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .row {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-family: ui-monospace, monospace;
      font-size: 13px;
      align-items: baseline;
    }

    .row .key {
      color: var(--blue);
      min-width: 120px;
    }

    .row .msg {
      color: var(--muted);
      font-style: italic;
      margin-left: auto;
    }

    .dice {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .dice .seat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
    }

    .dice .seat .name {
      color: var(--blue);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .dice .seat .faces {
      font-family: ui-monospace, monospace;
      font-size: 16px;
      letter-spacing: 4px;
    }

    .empty {
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }

    .error {
      color: var(--red);
      padding: 12px;
    }

    .time-cell {
      font-size: 12px;
      color: var(--muted);
    }

    .event-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--blue);
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      display: none;
    }

    .event-badge.show {
      display: block;
      animation: fadeOut 1.5s ease-out forwards;
    }

    @keyframes fadeOut {
      0% {
        opacity: 1
      }

      80% {
        opacity: 0
      }

      100% {
        opacity: 0;
        display: none
      }
    }
  </style>
</head>

<body>
  <h1>🎮 agent-game 管理后台</h1>
  <div class="subtitle">
    <span id="ws-indicator"><span class="dot dead"></span> 未连接</span>
  </div>
  <div class="event-badge" id="event-badge">📡 更新</div>

  <table>
    <thead>
      <tr>
        <th>类型</th>
        <th>对局 ID</th>
        <th>状态</th>
        <th>详情</th>
        <th>创建时间</th>
      </tr>
    </thead>
    <tbody id="game-list"></tbody>
  </table>

  <div class="detail-panel" id="detail-panel">
    <div class="detail-title" id="detail-title"></div>
    <div id="detail-content"></div>
  </div>

  <script>
    // ── 约定 ──
    //
    // 后端返回的是信封：{ session_id, game_type, display_name, state }。
    // `state` 是**引擎自己的** JSON，页面不假设它的键名——除了两个所有引擎
    // 都该提供的：`phase`（或 `status`）与 `players`。新游戏只要给这两个，
    // 页面就能显示得像样；其余字段原样列出，不需要改这个文件。
    //
    // 展示名由服务端下发（`display_name`），页面不硬编码任何游戏名。
    // 状态只分"进行中 / 已结束"两类——旧版维护了一张 STATUS_ORDER 表，
    // 新游戏必须回来加一行，那是错误的耦合。

    const API = {
      games: '/api/v1/admin/games',
      ws: '/api/v1/admin/ws',
    };

    let activeId = null;

    // ── 转义 ──
    //
    // 所有拼进 innerHTML 的外部字符串都过这里。玩家名与叫数留言直接来自
    // Agent，占位符是 `<img onerror=...>` 时页面会执行脚本；而这个页面是
    // 唯一能看到 target / all_dice 的地方，注入等于把秘密交给攻击者。
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(ms) {
      if (ms == null) return '—';
      const d = new Date(Number(ms));
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleTimeString() + '.' + String(d.getMilliseconds()).padStart(3, '0');
    }

    // ── 请求 ──
    async function adminFetch(url) {
      const opts = {};
      if (window.ADMIN_TOKEN) opts.headers = { 'X-Admin-Token': window.ADMIN_TOKEN };
      const resp = await fetch(url, opts);
      if (resp.status === 403) throw new Error('403：token 缺失或不匹配');
      if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
      return resp.json();
    }

    // ── 状态归类 ──
    //
    // 引擎的终态名由引擎自己声明，页面拿不到那张表，所以只看两个可观测特征：
    // 阶段名（finished/won/lost 是内置引擎用的）与 `ended_at*` 是否存在。
    // 新引擎用 `draw` 之类的终态时，只要写 `ended_at_ms` 就会被认出来。
    function isFinished(state) {
      const phase = state.phase ?? state.status;
      return phase === 'finished' || phase === 'won' || phase === 'lost' ||
        state.ended_at != null || state.ended_at_ms != null;
    }

    // ── 列表 ──
    async function refresh() {
      const tbody = document.getElementById('game-list');
      let body;
      try {
        body = await adminFetch(API.games);
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="error">${esc(error.message)}</td></tr>`;
        return;
      }

      const games = body.games ?? [];
      if (!games.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无对局 — 让 Agent 开始游戏吧</td></tr>';
        return;
      }

      // 进行中的排前面；同组内按创建时间倒序。不引入状态名优先级表。
      games.sort((a, b) => {
        const finishedA = isFinished(a.state ?? {}) ? 1 : 0;
        const finishedB = isFinished(b.state ?? {}) ? 1 : 0;
        return finishedA - finishedB || Number(b.created_at ?? 0) - Number(a.created_at ?? 0);
      });

      tbody.innerHTML = games.map((game) => {
        const state = game.state ?? {};
        const phase = state.phase ?? state.status ?? '?';
        const finished = isFinished(state);
        const sid = String(game.session_id ?? '');
        const type = esc(game.display_name ?? game.game_type ?? '?');
        const players = Array.isArray(state.players) ? state.players.join(' vs ') : '';
        const call = state.current_call
          ? `${esc(state.current_call.quantity)}×${esc(state.current_call.face)}`
          : '—';

        return `<tr data-id="${esc(sid)}" style="cursor:pointer">
      <td><span class="game-type">${type}</span></td>
      <td><code>${esc(sid)}</code></td>
      <td><span class="status ${finished ? 'done' : 'live'}">${esc(phase)}</span></td>
      <td>${esc(players)} | 叫: ${call}</td>
      <td class="time-cell">${esc(formatTime(game.created_at))}</td>
    </tr>`;
      }).join('');

      // 事件委托：不把 session id 拼进 onclick 属性（那又是一处注入面）
      for (const row of tbody.querySelectorAll('tr[data-id]')) {
        row.addEventListener('click', () => showDetail(row.dataset.id));
      }
    }

    // ── 详情 ──
    async function showDetail(sessionId) {
      activeId = sessionId;
      const panel = document.getElementById('detail-panel');
      const title = document.getElementById('detail-title');
      const content = document.getElementById('detail-content');
      panel.classList.add('active');

      let game;
      try {
        game = await adminFetch(`${API.games}/${encodeURIComponent(sessionId)}`);
      } catch (error) {
        title.textContent = '读取失败';
        content.innerHTML = `<div class="error">${esc(error.message)}</div>`;
        return;
      }

      const state = game.state ?? {};
      title.textContent = `${game.display_name ?? game.game_type ?? '?'} — ${sessionId}`;
      content.innerHTML = renderState(state);
    }

    // 渲染引擎状态。认识的字段用好看的样式，其余原样列出——
    // 这样新游戏不需要改这个页面就能看到自己的状态。
    function renderState(state) {
      const handled = new Set(['phase', 'status', 'players', 'alive', 'all_dice',
        'current_call', 'call_history', 'ended_at', 'ended_at_ms', 'created_at']);
      const parts = [];

      // 骰子：每个玩家一列
      if (Array.isArray(state.all_dice) && Array.isArray(state.players)) {
        const seats = state.all_dice.map((dice, index) => {
          const name = state.players[index] ?? `#${index}`;
          const alive = Array.isArray(state.alive) ? state.alive[index] : true;
          const faces = (dice ?? []).map((face) => '⚀⚁⚂⚃⚄⚅'[Number(face) - 1] ?? '?').join(' ');
          return `<div class="seat"><div class="name">${esc(name)}${alive ? '' : '（已出局）'}</div>
        <div class="faces">${esc(faces) || '—'}</div></div>`;
        });
        parts.push(`<div class="dice">${seats.join('')}</div>`);
      }

      // 叫数历史
      if (Array.isArray(state.call_history) && state.call_history.length) {
        parts.push(state.call_history.map((call) => {
          const who = call.player_name ?? call.player ?? '?';
          const what = call.quantity > 0 ? `${call.quantity}×${call.face}` : '—';
          const message = call.message ? `<span class="msg">"${esc(call.message)}"</span>` : '';
          return `<div class="row"><span class="key">${esc(who)}</span>
        <span>${esc(what)}</span>${message}</div>`;
        }).join(''));
      }

      // 关键值摘要
      const summary = [];
      for (const key of ['phase', 'status', 'target', 'current_turn', 'winner', 'loser']) {
        if (state[key] != null) summary.push(`${key}=${JSON.stringify(state[key])}`);
      }
      if (summary.length) {
        parts.unshift(`<div class="row"><span class="key">摘要</span>
      <span>${esc(summary.join('  '))}</span></div>`);
      }

      // 其余字段原样列出
      for (const [key, value] of Object.entries(state)) {
        if (handled.has(key)) continue;
        parts.push(`<div class="row"><span class="key">${esc(key)}</span>
      <span>${esc(JSON.stringify(value))}</span></div>`);
      }

      return parts.length ? parts.join('') : '<div class="empty">暂无数据</div>';
    }

    // ── WebSocket ──
    //
    // 浏览器不能给 WebSocket 设自定义头，token 走查询参数；不匹配服务端返回 403。
    // 推送内容只有 `{type: "state_changed"}`，不含任何状态——秘密信息永远通过
    // 带 token 的 HTTP 接口取，不经过这条连接。
    function connect() {
      if (!window.ADMIN_TOKEN) {
        document.getElementById('ws-indicator').innerHTML =
          '<span class="dot dead"></span> 未注入 token（只读，接口会 403）';
        return;
      }
      const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${scheme}//${location.host}${API.ws}?token=${encodeURIComponent(window.ADMIN_TOKEN)}`;
      const ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        document.getElementById('ws-indicator').innerHTML =
          '<span class="dot live"></span> WebSocket 实时推送';
        refresh();
      });

      ws.addEventListener('close', () => {
        document.getElementById('ws-indicator').innerHTML =
          '<span class="dot dead"></span> 已断开，<a href="javascript:location.reload()" style="color:var(--blue)">刷新</a>';
      });

      ws.addEventListener('message', () => {
        refresh();
        if (activeId) showDetail(activeId);
        const badge = document.getElementById('event-badge');
        badge.classList.remove('show');
        void badge.offsetWidth; // 强制重排，让动画重播
        badge.classList.add('show');
      });
    }

    // 先拉一次列表：即使 WS 连不上（比如没带 token），也能看到"未授权"
    // 这类明确错误，而不是一片空白。
    refresh();
    connect();
  </script>
</body>

</html>
