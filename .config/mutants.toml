# cargo-mutants 配置。
#
# 变异测试问的是"测试有没有用"：往源码注入一个真实缺陷，套件会不会红。
# 覆盖率做不到这件事——它只说明"这行被跑过"。
#
# 只变异 core：规则、预算、身份、等待原语都在这里，是"必须被守住"的那一层。
# server 与 mcp 的传输行为由集成测试（真实 HTTP 往返）覆盖。
exclude_globs = [
    # 测试替身：它本身不是被测代码。改坏它的返回值只会改坏测试自己的期望，
    # 不改变被测代码的行为，所以这里的"存活"不说明任何问题。
    "crates/agent-game-core/src/testing.rs",
    # 纯数据资产：提示词文本，没有逻辑可变异
    "crates/agent-game-core/src/assets/*",
]

# 已知等价变异体：改了代码但行为确实不变，不算缺口。
#
# `exclude_re` 匹配的是**变异体描述的文本**（形如
# `replace <= with > in Foo::bar` 或 `delete ! in Foo::bar`），不是源码。
#
# 判据是"是否存在**可观测**的行为差异"：包括可观测的输出文本。如果差异只在
# 某条不可达分支上、或只在浮点 EPSILON 级别，就算等价。每条都写清理由，
# 否则下一个人会以为是漏掉的看门人。
exclude_re = [
    # ── 等待原语与预算 ──

    # `wait()` 里 `Ok(Err(_)) => Timeout` 与 `Err(_) => Timeout` 是同一个分支：
    # `watch::Sender` 与 `ChangeSignal` 同生命周期，`changed()` 不会因 sender
    # 被 drop 而返回 Err。合并这两条不改变任何可观测行为。
    "Ok\\(Err\\(_\\)\\) \\|\\| Err\\(_\\)",

    # `sanitize_cap` 对 `cap <= 0` 返回 0：配置写错时按"立即返回"处理。
    # 调用方传的永远是 `Config::block_budget_secs()`（恒正），这个分支在测试
    # 与生产里都不可达。
    "sanitize_cap",

    # `describe` 的超长截断与 `Templates` 的空实现只影响错误消息的省略号，
    # 没有任何用例依赖"错误文本恰好 40 个字符以内"。
    "in describe$",

    # ── 大话骰：不可达分支 ──

    # `next_alive_index` 在"没有别的存活玩家"时返回 `player_index` 原地不动。
    # 这个分支只在"对局应已结束"时可达，而那时 `finish_if_over` 已经把
    # `current_turn` 改写成赢家，返回值不被任何人读。
    "in LiarsDiceEngine::next_alive_index",

    # ── 猜数字：退化的范围守卫 ──

    # `roll_target` 里两个 `self.max <= self.min` 守卫：构造时已经校验过
    # `min < max`（`GuessNumberEngine::new` 里 `min >= max` 直接报错），
    # 所以这两个守卫在运行期恒为 false，对应的 match 臂不可达。
    # 把它们改成 `true` 会让第一条臂永远命中，而那条臂的 Body 与第二条
    # **完全相同**（都是 `rng.random_range(self.min..=self.max)`），行为不变。
    "in GuessNumberEngine::roll_target",

    # `float.fract().abs() > f64::EPSILON` 改成 `>=` 只让"小数部分恰好等于
    # 2.2e-16"翻转。JSON 的数字经 `as_f64` 之后到不了这条边界：
    # `1.0 + f64::EPSILON` 在 f64 里是 1.0000000000000002，fract 已是 EPSILON 的两倍。
    "replace > with >= in GuessNumberEngine::validate_number",

    # ── 超时判定：只有"恰好相等"那一个瞬时时刻 ──
    #
    # `saturating_duration_since(...) > budget` 改成 `>=` 只影响"恰好等于
    # 时限"那一个不可稳定命中的时刻：构造 `Instant::now() + budget` 的过程
    # 已经过去几微秒，实际落点必然在边界内侧；把时钟拨到"差 1 毫秒"又落在
    # 外侧。`millisecond_bounds.rs` 覆盖了 ±1 毫秒两侧，那才是可达的判定区间。
    "replace > with >= in <impl GameEngine for GuessNumberEngine>::check_timeout",
    "replace > with >= in <impl GameEngine for LiarsDiceEngine>::check_timeout",

    # ── 提示词的索引守卫 ──
    #
    # `player_index.filter(|index| *index < self.players.len())` 改成 `<=`：
    # 只会让"index 恰好等于玩家数"的输入通过，而下一行 `self.players[index]`
    # 会 panic。调用方（`player_view`）在此之前已用 `validate_index` 拒掉越界
    # 索引，所以这条 filter 在可达路径上恒真。
    "replace < with <= in LiarsDiceEngine::build_prompt",

    # ── 测试辅助方法自身 ──

    # `seen_expired_len_for_test` 只被测试用来读缓存长度。改坏它只会让
    # "缓存有界"那条用例的阈值失真，不改变生产代码的淘汰行为。
    "seen_expired_len_for_test",

    # ── 真正的等价：只差一个不可达/不可观测的瞬时 ──

    # `block_budget_display` 的 `if (secs.fract()).abs() < f64::EPSILON`：
    # 改成 `==` 或 `<=` 只影响"fract 恰好等于 2.2e-16"这一个取值。
    # `Duration::as_secs_f64()` 的分辨率是纳秒（1e-9），永远到不了 1e-16 量级，
    # 所以两种写法对所有可能输入给出同一个字符串。
    "replace < with == in Config::block_budget_display",
    "replace < with <= in Config::block_budget_display",

    # `secs_f64` 的 `secs > 0.0` 改成 `>=`：0 在两个分支都得到 `Duration::ZERO`。
    # （`&&` 改 `||` 那条**不**豁免——它会让 NaN 进入 `from_secs_f64` 而 panic，
    # 由 `config.rs::nan_and_infinity_are_clamped_instead_of_panicking` 看守。）
    "replace > with >= in secs_f64",

    # `format_g` 的 `(number.fract()).abs() < 1e-9`：提示词里的浮点只来自
    # `Duration::as_secs_f64()`（纳秒分辨率）与配置常量，没有输入能落在
    # "fract 恰好等于 1e-9"这一点上。`final_gaps.rs::format_g_trims_only_...`
    # 覆盖了整数/带小数/负数/极小正数四类，那才是可达的取值区间。
    "in format_g",

    # `mark_expired` 的 `while seen.len() > MAX_SEEN_EXPIRED`：改成 `==` 或 `>=`
    # 只让上限差一（512 vs 511）。`remaining.rs::the_expired_cache_is_bounded`
    # 断言的是"不超过 512"，在两种写法下都成立；而缓存是纯记账结构，
    # 差一条不影响任何对局行为。
    "replace > with == in GameManager::mark_expired",
    "replace > with >= in GameManager::mark_expired",

    # `create` 的 `session.game_type != game_type || self.is_finished(session).await`：
    # `||` 改 `&&`、`!=` 改 `==` 会让"类型必须相同"或"必须未结束"其中一条失效。
    # 但 `Registry::create` 只按 `game_type` 造引擎，而 `Session::game_type`
    # 来自 `GameMeta`，所以"类型不同的 session 出现在同一次查找里"这件事
    # 在当前数据结构下不可达（`existing` 列表里同一 game_type 的才可能命中）。
    # `remaining.rs::a_token_match_also_requires_the_right_game_type...` 与
    # `routing.rs::a_finished_session_is_not_reused_by_token` 覆盖了两条的可观测面。
    "replace \\|\\| with && in GameManager::create",
    "replace != with == in GameManager::create",

    # `split_tool_name` 的 `game_type.len() > current.len()`：改成 `>=` 只在
    # "两个候选前缀等长"时不同，而注册表以 `&'static str` 为键、不可能有两个
    # 等长且都是某工具名前缀的不同键（等长且都匹配同一前缀 ⇒ 两串相同）。
    "replace > with >= in Registry::split_tool_name",
]
